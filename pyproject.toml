[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voicestudio-cf"
version = "1.0.0"
description = "VoiceStudio_CF: Local Text-to-Speech Desktop Application powered by VoiceStudio & OmniVoice"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{name = "VoiceStudio CF Team"}]
keywords = [
    "tts",
    "text-to-speech",
    "speech-synthesis",
    "voice-cloning",
    "voicestudio",
    "omnivoice",
    "desktop",
    "pyside6",
]
classifiers = [
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "PySide6>=6.7",
    "torch>=2.4",
    "torchaudio>=2.4",
    "transformers>=5.3.0",
    "accelerate",
    "pydub",
    "numpy",
    "soundfile",
    "librosa",
]

[project.optional-dependencies]
sherpa = [
    "sherpa-onnx",
]
all = [
    "sherpa-onnx",
    "num2words",
]

[project.scripts]
voicestudio-cf = "voicestudio_cf.app.main:main"

[tool.uv.sources]
torch = [
  { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.sdist]
include = ["voicestudio_cf", "omnivoice"]

[tool.hatch.build.targets.wheel]
packages = ["voicestudio_cf", "omnivoice"]
